name: '🏗️ Build flux-ffmpeg'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# `flux` carries Flux's patches on top of FFmpeg, the way upstream used a branch
# named `jellyfin` for theirs. `master` still tracks FFmpeg itself, so naming
# this one `main` would have read as though it were the FFmpeg trunk.
on:
  push:
    branches:
      - flux
    paths-ignore:
      - '**/*.md'

  pull_request:
    branches:
      - flux
    paths-ignore:
      - '**/*.md'

# Debian only, and only the codenames Flux's own image is built on. Upstream
# also builds Ubuntu, Windows and macOS; Flux consumes none of them, and every
# one of those jobs is build minutes spent on nothing.
jobs:
  build_debian:
    uses: ./.github/workflows/_meta.yaml
    with:
      distro: 'debian'
      codenames: '["bookworm", "trixie"]'
      architectures: '["amd64", "arm64"]'
      release: false
